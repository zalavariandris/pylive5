[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyLive5"
version = "0.1.0"
description = "Development workspace for PyFlow5 and its supporting libraries."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pyflow5"
]

[tool.setuptools]
packages = []

[tool.uv.sources]
pyflow5 = { workspace = true }

[tool.uv.workspace]
members = [
    "myqtx", 
    "myutils",
    "PyFlow5", 
    "PyGraphRT", 
    "QDAGEditor5", 
    "QScriptEdit2",
    "QtScriptEditorAdvanced"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt>=4.5.0",
]

[project.optional-dependencies]
exe = ["pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
# Keep test temporary files in the workspace to avoid system-temp permission issues.
addopts = ["--import-mode=importlib", "--basetemp=.pytest_cache/tmp"]
consider_namespace_packages = true
