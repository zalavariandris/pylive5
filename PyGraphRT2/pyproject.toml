[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygraphrt2"
version = "0.2.0"
authors = [
    { name = "András Zalavári", email = "zalavariandris@gmail.com" }
]
description = "Runtime for Python dataflow graphs."
requires-python = ">=3.10"
dependencies = [
    "qtpy",
    "dictdiffer",
    "pytools",
    "schema>=0.7.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pygraphrt2", "pygraphrt2.*"]
namespaces = false

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", ".venv_/*"]
