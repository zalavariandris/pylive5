[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphcook"
version = "0.1.0"
authors = [
    { name = "András Zalavári", email = "zalavariandris@gmail.com" }
]
description = "Runtime for Python dataflow graphs."
requires-python = ">=3.10"
dependencies = [

]

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphcook", "graphcook.*"]
namespaces = false

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", ".venv_/*"]
