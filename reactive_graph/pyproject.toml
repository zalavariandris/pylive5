[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reactive_graph"
version = "0.5.0"
authors = [
    { name = "András Zalavári", email = "zalavariandris@gmail.com" }
]
description = "A collection of functions for VFX operations"
requires-python = ">=3.10"
dependencies = [
    
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["reactive_graph", "reactive_graph.*"]
namespaces = false

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", ".venv_/*"]
