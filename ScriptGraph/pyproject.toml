[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptgraph"
version = "0.1.0"
description = "Python subset import/export and source preservation for live PyGraphRT graphs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygraphrt"]

[tool.uv.sources]
pygraphrt = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["scriptgraph", "scriptgraph.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../PyGraphRT/src"]
